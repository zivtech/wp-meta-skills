name: sec-wrong-object-capability-v1
suite: wordpress-security-critic
skill_under_test: wordpress-security-critic
skill_type: critic
difficulty_tier: focused
provenance: authored
risk_class: broken_access_control_wrong_capability
expected_wordpress_apis:
  - "current_user_can"
  - "edit_post"
  - "map_meta_cap"
expected_verification_surfaces:
  - "PHPUnit test asserting an author cannot rename a post they do not own"
  - "Capability matrix check across author, editor, and subscriber roles"
must_detect:
  - "the capability gate uses the general edit_posts meta-capability instead of the object-level edit_post for the specific post id being modified"
  - "an author can rename a post they do not own because ownership of the target post is never checked"
negative_space:
  - "does not prove production exploitability without runtime context"
  - "does not cover dependency or supply-chain review"
