fixture: sec-decorative-capability-branch-v1
skill_under_test: wordpress-security-critic
max_score: 4
criteria:
  - id: detect_non_gating_branch
    weight: 2
    description: "Identifies that the denial branch only fires an action and does not return or exit, so wp_delete_post executes even when current_user_can is false."
  - id: cite_return_fix
    weight: 1
    description: "Names the fix: return or wp_send_json_error() (which dies) inside the denial branch so control flow cannot reach the deletion."
  - id: no_false_positive_on_correct_capability
    weight: 1
    type: false_positive_trap
    description: "Does not claim the wrong capability is used; current_user_can('delete_post', $item_id) is the correct object-level check — the flaw is that it does not gate the mutation."
domain_signals:
  must_detect:
    - "the capability result is computed but the denial branch does not return or exit, so wp_delete_post runs even when the user lacks the capability"
    - "control flow falls through to the deletion regardless of the current_user_can result"
  expected_wordpress_apis:
    - "current_user_can"
    - "wp_send_json_error"
    - "wp_die"
  must_not_penalize_or_do:
    - "claims the object capability is wrong when current_user_can('delete_post', $item_id) is in fact correct"
    - "claims the nonce is missing when check_ajax_referer is present"
