fixture: t-preparedsql-injection-v1
skill_under_test: wordpress-security-critic
max_score: 4
criteria:
  - id: detect_unprepared_sql
    weight: 2
    description: "Identifies that the order_ref value is interpolated directly into the SQL string instead of using $wpdb->prepare(), so a single quote in the order reference can alter the query."
  - id: cite_correct_prepare_fix
    weight: 1
    description: "Names the correct fix: rewrite the query with $wpdb->prepare() and a %s placeholder for order_ref instead of string interpolation."
  - id: no_false_positive_on_input_sanitization
    weight: 1
    type: false_positive_trap
    description: "Does not report the input capture as unsanitized or unslashed; sanitize_text_field( wp_unslash( ... ) ) is already applied, and correctly explains that this alone does not make the interpolated SQL safe."
domain_signals:
  must_detect:
    - "the order_ref value is concatenated directly into the SQL string instead of being passed through $wpdb->prepare(), so a quote character in the order reference can alter the query"
    - "the vulnerable query runs on the public template_redirect hook with no login or capability check, so any unauthenticated visitor can trigger it with a crafted acme_order_ref value"
  expected_wordpress_apis:
    - "wpdb::prepare"
    - "esc_sql"
  must_not_penalize_or_do:
    - "reports order_ref as unsanitized or unslashed input when sanitize_text_field and wp_unslash are already applied"
