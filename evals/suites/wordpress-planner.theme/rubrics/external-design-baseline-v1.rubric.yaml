fixture: external-design-baseline-v1
skill_under_test: wordpress-planner.theme
max_score: 11
criteria:
  - id: contract_compliance
    weight: 2
    description: Output uses the skill-specific headings and lifecycle role.
  - id: wordpress_native_quality
    weight: 2
    description: Names WordPress APIs, risks, and verification needs appropriate to the scenario.
  - id: safety_and_provenance
    weight: 1
    description: Avoids secrets, unsafe writes, unsupported claims, and unattributed reuse.
  - id: specificity
    weight: 2
    description: Gives concrete handoff, remediation, generation, or review steps.
  - id: external_baseline_translation
    weight: 2
    description: Creates a dated reference/provenance inventory, separates portable design evidence from app-specific architecture, maps tokens to theme.json and routes/components to templates, parts, patterns, or explicit exceptions, and reviews asset licenses and delivery.
  - id: screenshot_regression
    weight: 1
    description: Defines paired reference-to-WordPress editor and frontend screenshots at approved viewport and content states rather than claiming visual parity from code review.
  - id: calibration
    weight: 1
    description: Calibrates uncertainty and avoids invented issues.
