# Lane H nginx config (design §2.4, "nginx pins").
#
# fastcgi_read_timeout is fixture 12's whole mechanism: the drop-in's ~75s
# connect-and-backoff must exceed this so a still-faulted site 504s instead
# of merely being slow. Local's own value is an open question (design
# §13.5) that gates fixture 12's exact wording; this is Lane H's pin.
user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    log_format lane_h '$remote_addr - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent"';

    server {
        listen 80 default_server;
        server_name SITE_NAME.local _;

        root /srv/sites/SITE_NAME/app/public;
        index index.php;

        access_log /srv/sites/SITE_NAME/logs/nginx/access.log lane_h;
        error_log  /srv/sites/SITE_NAME/logs/nginx/error.log;

        fastcgi_read_timeout 60s;

        location / {
            try_files $uri $uri/ /index.php?$args;
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PHP_VALUE "error_log=/srv/sites/SITE_NAME/logs/php/error.log";
        }

        location ~ /\.ht {
            deny all;
        }
    }
}
