; Lane H php.ini parity block (design §2.4).
;
; These directives change what an agent SEES (whether a fatal prints
; file:line in the browser, whether error.log exists at all, TTFB
; behavior) and therefore what several fixtures measure. Every value here
; is a PIN, not a guess about what Local ships — design §13 lists which of
; these are still open questions pending a real Local install, and the
; design's own instruction is: verify against Local before the prompt hash
; freeze, and follow Local's value if it differs from this pin. Until that
; verification happens, this file is Lane H's committed, reproducible
; baseline — not a claim about Local.

[PHP]
; §13.1 (open): if Local ships display_errors=On, fixture 1/4/13's lift
; predictions must be redone (fatal file:line becomes visible in-browser).
display_errors = Off
display_startup_errors = Off

log_errors = On

; §13.2 (open): whether Local sets this as a php.ini value (WordPress's own
; ini_set('error_log', .../debug.log) can override it) or as a php-fpm pool
; php_admin_value (which WordPress cannot override). Pinned here as a plain
; ini value so ini_set() works, matching the "WP_DEBUG_LOG has an effect"
; assumption fixture 2 depends on; fixture 13 is independent of this by
; construction (design §5 row 13).
error_log = /srv/sites/SITE_NAME/logs/php/error.log

error_reporting = E_ALL

; §13.9 (open): governs whether the theme header renders above the
; fatal-error-handler message (fixture 1/4/13 prompt wording).
output_buffering = 4096

; Linux: sleep()/socket connect waits do NOT count against this (fixture 12
; relies on that — the drop-in's fsockopen()+sleep() backoff is not killed
; by max_execution_time; only nginx's fastcgi_read_timeout applies).
max_execution_time = 30

memory_limit = 256M

; Local-shaped per-site socket path (design §2.4), not the distro default.
; buildWpCliEnv/-d mysqli.default_socket= exercises this for real.
mysqli.default_socket = /srv/run/SITE_ID/mysql/mysqld.sock
pdo_mysql.default_socket = /srv/run/SITE_ID/mysql/mysqld.sock

; Formatted-date assertions (fixture 1, finding 4) assume UTC.
date.timezone = UTC

[opcache]
; Off in Lane H: every fixture edits PHP source between runs, and stale
; opcache would silently defeat that. Local ships this off in dev mode too.
opcache.enable = 0
