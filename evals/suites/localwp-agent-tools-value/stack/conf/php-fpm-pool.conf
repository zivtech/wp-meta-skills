; Lane H php-fpm pool (design §2.4).
;
; Deliberately plain php_value, not php_admin_value, for error_log — see
; conf/php.ini's comment on design §13.2. A php_admin_value here would make
; WordPress's ini_set('error_log', .../debug.log) a no-op, which changes
; fixture 2's mechanism; Lane H's pin keeps ini_set() effective until a real
; Local install says otherwise.
[www]
user = www-data
group = www-data
listen = /run/php/php8.3-fpm.sock
listen.owner = www-data
listen.group = www-data
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4

php_value[error_log] = /srv/sites/SITE_NAME/logs/php/error.log
php_flag[log_errors] = on
